; MetaSense-DYNO PlatformIO Configuration
;
; Compile-time facilities:
; - METASENSE_STREAM_DIAGNOSTICS (default: 1)
;   Enable stream counters (ws_clients, ws_sent_total, ws_skip_* stats)
;   To disable: add to build_flags: -D METASENSE_STREAM_DIAGNOSTICS=0
;
; - METASENSE_JSON_DELAY_COUNTERS (default: 0)
;   Enable JSON payload size measurements (ws_json_last_len, ws_json_max_len, ws_json_over_reserve_total)
;   Useful for tuning String.reserve() sizing during development
;   To enable: add to build_flags: -D METASENSE_JSON_DELAY_COUNTERS=1
;
; - METASENSE_WS_FAST_PERIOD_MS (default: 50)
;   Dashboard telemetry update interval in milliseconds
;   Current: 50ms (20 Hz) with JSON buffer 1200 bytes, 8-message queue (~400ms resilience)
;   Provides smooth real-time updates without overwhelming WebSocket/network
;   To change: add to build_flags: -D METASENSE_WS_FAST_PERIOD_MS=30 (adjust as needed for stability)
;
; - METASENSE_CAN_MONITOR_JSON_ENABLED (default: 0)
;   Enable CAN Monitor JSON telemetry transmission (detailed 0x1DA/0x55A/0x11A/0x1D4 raw data)
;   When 0 (disabled): WebSocket sends only main telemetry (~600 bytes), faster updates
;   When 1 (enabled): WebSocket sends detailed CAN frame data (~1500+ bytes), slower updates
;   All CAN data is still captured internally regardless of this flag
;   To enable: add to build_flags: -D METASENSE_CAN_MONITOR_JSON_ENABLED=1
;
; WebSocket Buffer Note:
;   AsyncTCP library controls internal queue depth (8 messages per client for minimal latency).
;   At 50ms cadence with 8-message buffer = ~400ms latency tolerance before frame drops.
;
; Example for debugging build:
;   build_flags = 
;       -D ARDUINO_USB_MODE=1
;       -D ARDUINO_USB_CDC_ON_BOOT=1
;       -D METASENSE_JSON_DELAY_COUNTERS=1
;       -D METASENSE_WS_FAST_PERIOD_MS=25
;       -D METASENSE_CAN_MONITOR_JSON_ENABLED=1
;       -I include
;

[env:esp32s3-ota]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
build_src_filter =
    +<*>
    -<egt_diag.cpp>
board_build.partitions = partitions/esp32s3_8mb_ota_littlefs.csv
board_build.filesystem = littlefs
build_type    = release
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D METASENSE_LEAF_CAN_RX_ENABLED=1
    -D METASENSE_LEAF_CAN_TX_ENABLED=1
    -D METASENSE_LEAF_CAN_LISTEN_ONLY=0
    -D METASENSE_LEAF_CAN_HANDSHAKE_ON_FIRST_1DA=0
    -D METASENSE_LEAF_CAN_TX_PIN=4
    -D METASENSE_LEAF_CAN_RX_PIN=5
    -D METASENSE_LEAF_VARIANT_120_55A=1
    -D METASENSE_LEAF_VCM_DIAGNOSTICS=0
    -D METASENSE_STREAM_DIAGNOSTICS=0
    -D METASENSE_CAN_ID_SCAN=0
    -D METASENSE_CAN_LOG_KEY_FRAMES=0
    -D METASENSE_CAN_LOG_ALL_FRAMES=0
    -D METASENSE_CAN_LOG_11A_CHANGES=0
    -D METASENSE_CAN_RX_ONE_LINE_LOG=0
    -D METASENSE_STARTUP_SNIFF_CAPTURE_ENABLE=0
    -D METASENSE_HEARTBEAT_PERIOD_MS=15000
    -D METASENSE_LEAF_SIM_FEEDBACK_WITHOUT_BUS=0
    -D METASENSE_RBPLUS_RELAY_ENABLED=1
    -D METASENSE_LEAF_1D4_TORQUE_LSB_NM=0.0625f
    -D METASENSE_LEAF_1D4_TEMPLATE_B0=0xF7U
    -D METASENSE_LEAF_1D4_TEMPLATE_B1=0x07U
    -D METASENSE_LEAF_1D4_TEMPLATE_B6=0x30U
    -D METASENSE_LEAF_11A_TX_ENABLED=1
    -D METASENSE_LEAF_11A_TEMPLATE_BOOTSTRAP_ENABLE=1
    -D METASENSE_LEAF_11A_FORCE_GEAR=4
    -D METASENSE_LEAF_11A_FORCE_CARONOFF=2
    -D METASENSE_CAN_MONITOR_JSON_ENABLED=0
    -I include
lib_ldf_mode    = deep+
lib_compat_mode = strict
lib_deps =
    adafruit/Adafruit NeoPixel @ 1.15.5
    adafruit/Adafruit MCP9600 Library @ 2.0.4
    me-no-dev/ESPAsyncWebServer @ 3.6.0
    me-no-dev/AsyncTCP @ 3.3.2 
;   adafruit/Adafruit BME0 Library @ ^3.0.0
    adafruit/Adafruit BME680 Library @ ^2.0.4
    bblanchon/ArduinoJson @ ^7.0.0
lib_ignore =
upload_protocol = espota
upload_port = 192.168.0.211
upload_flags =
    --auth=metasense
; Network-based serial monitoring via telnet on OTA device at 192.168.0.211
monitor_speed = 115200
monitor_port = socket://192.168.0.211:23
monitor_dtr = 0
monitor_rts = 0

