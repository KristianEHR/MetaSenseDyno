<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetaSense Dyno - Trends & History</title>
  <link rel="icon" href="/favicon.png" type="image/x-icon">

  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: 'Courier New', monospace; 
      background: #404040; 
      color: #cccccc; 
      margin: 0; 
      padding: 0; 
      min-height: 100vh;
    }
    
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: #353535;
      border-bottom: 2px solid #666;
      padding: 15px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    
    .title {
      color: #e0e0e0; 
      font-size: 28px; 
      letter-spacing: 3px; 
      text-shadow: 0 0 8px #444;
      font-weight: bold;
    }
    
    .button-stack button, .button-stack a button { 
      padding: 10px 24px; 
      font-size: 16px; 
      background: #404040; 
      color: #ffffff; 
      border: 2px solid #888; 
      border-radius: 10px; 
      cursor: pointer; 
      font-weight: bold;
      transition: all 0.2s ease;
      font-family: 'Courier New', monospace;
    }
    
    .button-stack button:hover { background: #505050; transform: scale(1.02); }
    
    #status { 
      font-size: 14px; 
      color: #88ff88;
      background: rgba(0,0,0,0.5);
      padding: 6px 15px;
      border-radius: 20px;
      font-weight: bold;
    }
    
    .live-badge {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #ff4444;
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 1.5s infinite;
    }
    
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    .main-container {
      margin-top: 90px;
      padding: 30px;
      max-width: 1600px;
      margin-left: auto;
      margin-right: auto;
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
    }
    
    .live-section { flex: 2; min-width: 500px; }
    .history-section { flex: 1; min-width: 320px; }
    
    .chart-box {
      background: #f0f0f0;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.8);
      border: 1px solid #bdbdbd;
      margin-bottom: 30px;
    }
    
    .chart-box h2 {
      margin: 0 0 20px 0;
      color: #222;
      font-size: 24px;
      text-align: center;
    }
    
    canvas {
      width: 100% !important;
      height: 180px !important;
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #d0d0d0;
      padding: 10px;
    }
    
    .history-box {
      background: #353535;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.8);
      border: 1px solid #666;
    }
    
    .history-box h2 {
      margin: 0 0 20px 0;
      color: #e0e0e0;
      font-size: 24px;
      text-align: center;
    }
    
    .run-list {
      max-height: 450px;
      overflow-y: auto;
      margin-bottom: 20px;
    }
    
    .run-item {
      background: #2a2a2a;
      margin-bottom: 12px;
      border-radius: 12px;
      border-left: 3px solid #88ff88;
      padding: 12px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    
    .run-item:hover { background: #3a3a3a; }
    
    .run-checkbox {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: #88ff88;
      margin-top: 2px;
    }
    
    .run-date { font-size: 11px; color: #888; margin-bottom: 5px; }
    .run-peaks { font-size: 13px; font-weight: bold; }
    .run-peaks span { color: #88ff88; }
    .run-customer { font-size: 11px; color: #aaa; margin-top: 5px; }
    
    .compare-btn {
      width: 100%;
      padding: 12px;
      background: #006000;
      border: 2px solid #00ff00;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      font-family: 'Courier New', monospace;
    }
    
    .compare-btn:hover { background: #008000; transform: scale(1.02); }
    .compare-btn.clear-btn { background: #604000; border-color: #ffaa44; }
    .compare-btn.delete-btn { background: #800000; border-color: #ff4444; }
    
    .no-runs { text-align: center; color: #888; padding: 40px; }
    
    .info-bar {
      background: #2a2a2a;
      padding: 15px 25px;
      border-radius: 12px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
      border-left: 4px solid #88ff88;
    }
    
    .info-item { font-size: 14px; color: #aaa; }
    .info-item strong { color: #88ff88; }
    
    .back-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      padding: 12px 24px;
      font-size: 16px;
      background: #505050;
      color: #ffffff;
      border: 1px solid #777;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      font-family: 'Courier New', monospace;
    }
    
    .back-btn:hover { background: #606060; transform: scale(1.02); }
    .refresh-btn { background: #404040; border: 1px solid #888; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
    .selection-info { font-size: 12px; color: #88ff88; text-align: center; margin-top: 10px; padding: 5px; background: rgba(0,0,0,0.3); border-radius: 8px; }
    
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.95);
      overflow-y: auto;
    }
    
    .modal-content {
      background: #353535;
      margin: 3% auto;
      padding: 30px;
      border-radius: 20px;
      border: 2px solid #88ff88;
      max-width: 1200px;
      width: 90%;
    }
    
    .compare-charts { display: flex; flex-direction: column; gap: 30px; }
    .compare-chart-box { background: #f6f6f6; padding: 20px; border-radius: 15px; border: 1px solid #c6c6c6; }
    .compare-chart-box h3 { margin: 0 0 15px 0; color: #222; text-align: center; }
    .compare-chart-box canvas { height: 300px !important; width: 100% !important; }
    
    .close {
      float: right;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
      color: #aaa;
    }
    .close:hover { color: white; }
    
    .modal-buttons { margin-bottom: 20px; display: flex; gap: 15px; justify-content: center; }
    .modal-buttons button { padding: 10px 24px; background: #404040; border: 2px solid #888; border-radius: 10px; color: white; cursor: pointer; }
    .compare-legend { margin-top: 20px; padding: 15px; background: #f6f6f6; color: #222; border-radius: 12px; display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
    .loading { text-align: center; padding: 20px; color: #88ff88; }
    
    @media (max-width: 900px) {
      .main-container { flex-direction: column; }
      .live-section, .history-section { min-width: auto; }
      .top-bar { padding: 12px 20px; flex-direction: column; text-align: center; }
      .main-container { margin-top: 130px; padding: 15px; }
      canvas { height: 150px !important; }
      .compare-chart-box canvas { height: 250px !important; }
    }
  </style>
  <script src="/chart.umd.min.js"></script>
  <script src="/jspdf.umd.min.js"></script>
</head>
<body>

  <div class="top-bar">
  <h1 id="versionInfo" style="text-align: center; color: #e0e0e0; text-shadow: 0 0 8px #444;">
  MetaSense --:-- | --
</h1>
<div class="button-stack">
      <a href="/"><button>← BACK TO DASHBOARD</button></a>
      <button class="refresh-btn" onclick="loadRuns()">⟳ REFRESH RUNS</button>
    </div>
    <div id="status"><span class="live-badge"></span>Connecting...</div>
  </div>

  <div class="main-container">
    <div class="live-section">
      <div class="info-bar">
        <div class="info-item"><strong>📈 Live Trend Data</strong> - Last 400 samples</div>
        <div class="info-item"><strong>🔄 Auto-scroll</strong> - Real-time readings</div>
      </div>
      <div class="chart-box"><h2>LAMBDA TREND</h2><canvas id="rpmChart"></canvas></div>
      <div class="chart-box"><h2>MASSFLOW TREND</h2><canvas id="drumRpmChart"></canvas></div>
      <div class="chart-box"><h2>POWER TREND</h2><canvas id="hpChart"></canvas></div>
      <div class="chart-box"><h2>TORQUE TREND</h2><canvas id="torqueChart"></canvas></div>
    </div>
    
    <div class="history-section">
      <div class="history-box">
        <h2>RUN HISTORY</h2>
        <div id="runList" class="run-list"><div class="no-runs">Loading runs...</div></div>
        <button class="compare-btn" id="compareBtn" onclick="compareSelected()">🔍 COMPARE SELECTED (0)</button>
        <button class="compare-btn" onclick="saveComparisonPdfFromSelection()">💾 SAVE COMPARISON PDF</button>
        <button class="compare-btn delete-btn" onclick="deleteSelectedRuns()">🗑️ DELETE SELECTED</button>
        <button class="compare-btn clear-btn" onclick="clearSelection()">🗑️ CLEAR SELECTION</button>
        <div id="selectionInfo" class="selection-info"></div>
      </div>
    </div>
  </div>
  
  <div id="compareModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeCompareModal()">&times;</span>
      <h2 style="color: #88ff88; text-align: center;">📊 RUN COMPARISON</h2>
      <div class="modal-buttons"><button onclick="closeCompareModal()">✖ CLOSE</button></div>
      <div id="compareLoading" class="loading" style="display: none;">📥 Loading run data...</div>
      <div class="compare-charts" id="compareCharts" style="display: none;">
        <div class="compare-chart-box"><h3>🏆 POWER COMPARISON</h3><canvas id="compareHPChart"></canvas></div>
        <div class="compare-chart-box"><h3>🔧 TORQUE COMPARISON</h3><canvas id="compareTorqueChart"></canvas></div>
      </div>
      <div id="compareLegend" class="compare-legend"></div>
    </div>
  </div>
  
  <a href="/" class="back-btn">← BACK TO DASHBOARD</a>

  <script>
    // ============== GLOBAL VARIABLES ==============
    let ws = null;
    let lambdaChart, hpChart, torqueChart, massflowChart;
    let maxVals = { rpm: 16000, hp: 15, torque: 15, drumRpm: 3000 };
    let updateTimeout = null;
    let runsData = [];
    let selectedRuns = [];
    let loadedRunData = {};
    let compareHPChart = null;
    let compareTorqueChart = null;
    let pendingComparisonPdfSave = false;
    let compareRenderSeries = [];
    const CHART_DPR = Math.min(3, Math.max(2, window.devicePixelRatio || 1));

    // Global chart style: white chart background with dark text for print-friendly exports.
    Chart.defaults.color = '#222';
    Chart.defaults.font.family = 'Arial, Helvetica, sans-serif';
    Chart.defaults.font.size = 12;
    Chart.defaults.font.weight = 'normal';
    Chart.defaults.borderColor = 'rgba(0,0,0,0.25)';
    Chart.defaults.devicePixelRatio = CHART_DPR;

    // ============== CHART FUNCTIONS ==============
    function createChart(id, color, label, maxY) {
      const canvas = document.getElementById(id);
      const ctx = canvas.getContext('2d');
      return new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [{ label: 'Live ' + label, data: [], borderColor: color, backgroundColor: color + '20', borderWidth: 1.5, tension: 0.2, fill: true, pointRadius: 0 }] },
        options: {
          animation: false,
          devicePixelRatio: CHART_DPR,
          responsive: true,
          maintainAspectRatio: true,
          scales: {
            x: {
              display: true,
              alignToPixels: true,
              grid: { color: 'rgba(0,0,0,0.12)', lineWidth: 1 },
              border: { color: '#666' },
              ticks: { color: '#222' },
              title: { display: true, text: 'Time →', color: '#111', font: { weight: 'normal' } }
            },
            y: {
              alignToPixels: true,
              min: 0,
              max: maxY,
              grid: { color: 'rgba(0,0,0,0.12)', lineWidth: 1 },
              border: { color: '#666' },
              ticks: { color: '#222' },
              title: { display: true, text: label, color: '#111', font: { weight: 'normal' } }
            }
          },
          plugins: { legend: { display: false } }
        }
      });
    }

    function updateCharts(lambda, hp, torque, massflow) {
      if (updateTimeout) return;
      updateTimeout = setTimeout(() => {
        lambdaChart.data.labels.push(''); lambdaChart.data.datasets[0].data.push(lambda);
        hpChart.data.labels.push(''); hpChart.data.datasets[0].data.push(hp);
        torqueChart.data.labels.push(''); torqueChart.data.datasets[0].data.push(torque);
        massflowChart.data.labels.push(''); massflowChart.data.datasets[0].data.push(massflow);
        
        if (lambdaChart.data.labels.length > 150) {
          lambdaChart.data.labels.shift(); lambdaChart.data.datasets[0].data.shift();
          hpChart.data.labels.shift(); hpChart.data.datasets[0].data.shift();
          torqueChart.data.labels.shift(); torqueChart.data.datasets[0].data.shift();
          massflowChart.data.labels.shift(); massflowChart.data.datasets[0].data.shift();
        }
        lambdaChart.update('none'); hpChart.update('none'); torqueChart.update('none'); massflowChart.update('none');
        updateTimeout = null;
      }, 50);
    }

    function createCompareChart(canvasId, datasets, labels, yTitle) {
      const ctx = document.getElementById(canvasId).getContext('2d');
      return new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets
        },
        options: {
          animation: false,
          devicePixelRatio: CHART_DPR,
          responsive: true,
          maintainAspectRatio: true,
          scales: {
            x: {
              alignToPixels: true,
              grid: { color: 'rgba(0,0,0,0.12)', lineWidth: 1 },
              border: { color: '#666' },
              title: { display: true, text: 'Engine RPM', color: '#111', font: { weight: 'normal' } },
              ticks: { color: '#222', maxRotation: 0, autoSkip: true, maxTicksLimit: 8 }
            },
            y: {
              alignToPixels: true,
              grid: { color: 'rgba(0,0,0,0.12)', lineWidth: 1 },
              border: { color: '#666' },
              title: { display: true, text: yTitle, color: '#111', font: { weight: 'normal' } },
              ticks: { color: '#222' }
            }
          },
          plugins: {
            legend: { display: false }
          },
          layout: { padding: { top: 6, right: 6, bottom: 6, left: 6 } }
        }
      });
    }

    // ============== RUN HISTORY FUNCTIONS ==============
    function loadRuns() { if (ws && ws.readyState === WebSocket.OPEN) ws.send("GET_RUNS"); }
    
    function displayRuns(runs) {
      const runListDiv = document.getElementById('runList');
      if (!runs || runs.length === 0) { runListDiv.innerHTML = '<div class="no-runs">📭 No saved runs yet<br>Do a dyno run first!</div>'; updateSelectionInfo(); return; }
      
      let html = '';
      runs.forEach((run, index) => {
        let dateStr = 'Unknown date';
        if (run.timestamp && run.timestamp > 100000) {
          dateStr = new Date(run.timestamp * 1000).toLocaleString();
        }
        const isChecked = selectedRuns.includes(index);
        html += `<div class="run-item"><input type="checkbox" id="run_${index}" class="run-checkbox" ${isChecked ? 'checked' : ''} onchange="toggleRunSelection(${index})"><div><div class="run-date">📅 ${dateStr}</div><div class="run-peaks">🏆 kW: <span>${run.hp.toFixed(1)}</span> &nbsp;|&nbsp; 🔧 Torque: <span>${run.torque.toFixed(1)}</span> Nm</div><div class="run-peaks">🔥 EGT: <span>${run.egt || 0}</span> °C</div><div class="run-customer">👤 ${run.customer || 'No customer'} | ${run.vehicle || 'No vehicle'}</div></div></div>`;
      });
      runListDiv.innerHTML = html;
      updateSelectionInfo();
    }
    
    function updateSelectionInfo() {
      document.getElementById('selectionInfo').innerHTML = selectedRuns.length > 0 ? `✅ ${selectedRuns.length} run(s) selected` : '💡 Select runs using checkboxes';
      document.getElementById('compareBtn').innerHTML = `🔍 COMPARE SELECTED (${selectedRuns.length})`;
    }
    
    function toggleRunSelection(index) {
      const cb = document.getElementById(`run_${index}`);
      if (cb.checked) { if (!selectedRuns.includes(index)) selectedRuns.push(index); }
      else { selectedRuns = selectedRuns.filter(i => i !== index); }
      updateSelectionInfo();
    }
    
    function clearSelection() {
      selectedRuns = [];
      runsData.forEach((_, idx) => { const cb = document.getElementById(`run_${idx}`); if (cb) cb.checked = false; });
      displayRuns(runsData);
      showToast("Selection cleared");
    }
    
    function deleteSelectedRuns() {
      if (selectedRuns.length === 0) { showToast("Select runs to delete first!"); return; }
      if (confirm(`Delete ${selectedRuns.length} selected run(s)?`)) {
        selectedRuns.forEach(idx => { const run = runsData[idx]; if (ws && ws.readyState === WebSocket.OPEN && run.filename) ws.send("DELETE_RUN:" + idx); });
        selectedRuns = [];
        setTimeout(() => loadRuns(), 500);
        showToast("Deleting runs...");
      }
    }
    
    // ============== COMPARISON FUNCTIONS ==============
    function drawComparison() {
  const readNum = (...vals) => {
    for (const v of vals) {
      const n = Number(v);
      if (Number.isFinite(n)) return n;
    }
    return 0;
  };

  const pointRpm = p => readNum(p?.r, p?.rpm, p?.x, p?.engine_rpm);
  const pointPower = p => readNum(p?.h, p?.kw, p?.hp, p?.p);
  const pointTorque = p => readNum(p?.t, p?.torque, p?.nm, p?.q);

  const runs = selectedRuns
    .map(idx => runsData[idx])
    .filter(run => run && run.filename && loadedRunData[run.filename])
    .map(run => ({ filename: run.filename, points: loadedRunData[run.filename].points }));
  if (runs.length === 0) { 
    console.log("No runs loaded"); 
    return; 
  }
  
  const colors = ['#ff8888', '#88ff88', '#8888ff', '#ffaa44', '#ff44aa', '#44ffaa'];
  const hpDatasets = [];
  const torqueDatasets = [];
  compareRenderSeries = [];
  let legendHtml = '';
  let allRpmLabels = [];
  
  runs.forEach((run, i) => {
    const color = colors[i % colors.length];
    const runInfo = runsData.find(r => r.filename === run.filename);
    
    if (run.points && run.points.length > 0) {
      // Sort points by RPM
      const sortedPoints = [...run.points].sort((a, b) => pointRpm(a) - pointRpm(b));
      
      const rpmData = sortedPoints.map(pointRpm);
      const hpData = sortedPoints.map(pointPower);
      const torqueData = sortedPoints.map(pointTorque);
      const hpPeak = hpData.reduce((m, v) => Math.max(m, Number(v) || 0), 0);
      const torquePeak = torqueData.reduce((m, v) => Math.max(m, Math.abs(Number(v) || 0)), 0);
      const who = runInfo?.customer || 'Run';
      const ts = runInfo && runInfo.timestamp && runInfo.timestamp > 100000
        ? new Date(runInfo.timestamp * 1000).toLocaleString()
        : 'unknown';

      compareRenderSeries.push({
        index: i + 1,
        customer: who,
        timestamp: ts,
        color,
        rpmData,
        hpData,
        torqueData,
        hpPeak,
        torquePeak
      });

      if (i === 0) {
        allRpmLabels = rpmData;
      }
      
      // Add HP dataset
      hpDatasets.push({
        label: `${who} - ${hpPeak.toFixed(1)} kW`,
        data: hpData,
        borderColor: color,
        backgroundColor: 'transparent',
        borderWidth: 1.5,
        tension: 0.2,
        fill: false,
        pointRadius: 0,
        spanGaps: true
      });
      
      // Add Torque dataset (separate!)
      torqueDatasets.push({
        label: `${who} - ${torquePeak.toFixed(1)} Nm`,
        data: torqueData,
        borderColor: color,
        borderWidth: 1.5,
        tension: 0.2,
        fill: false,
        pointRadius: 0,
        spanGaps: true
      });
      
      legendHtml += `<span style="color: ${color};"><strong>● Run ${i + 1}</strong> ${who}: ${hpPeak.toFixed(1)} kW / ${torquePeak.toFixed(1)} Nm</span>`;
    }
  });
  
  document.getElementById('compareLegend').innerHTML = legendHtml;
  document.getElementById('compareLoading').style.display = 'none';
  document.getElementById('compareCharts').style.display = 'block';
  
  // Destroy existing charts
  if (compareHPChart) {
    compareHPChart.destroy();
    compareTorqueChart.destroy();
  }
  
  compareHPChart = createCompareChart('compareHPChart', hpDatasets, allRpmLabels, 'Power [kW]');
  compareTorqueChart = createCompareChart('compareTorqueChart', torqueDatasets, allRpmLabels, 'Torque [Nm]');

  if (pendingComparisonPdfSave) {
    pendingComparisonPdfSave = false;
    setTimeout(() => generateComparisonPDF(), 180);
  }
}

    function generateComparisonPDF() {
            function chartImageWithWhiteBackground(canvas) {
              const tmp = document.createElement('canvas');
              tmp.width = canvas.width;
              tmp.height = canvas.height;
              const tctx = tmp.getContext('2d');
              tctx.fillStyle = '#ffffff';
              tctx.fillRect(0, 0, tmp.width, tmp.height);
              tctx.drawImage(canvas, 0, 0);
              return tmp.toDataURL('image/png');
            }

            function colorHexToRgb(hex) {
              if (typeof hex !== 'string') return null;
              const normalized = hex.trim();
              const match = /^#([0-9a-fA-F]{6})$/.exec(normalized);
              if (!match) return null;
              const val = parseInt(match[1], 16);
              return {
                r: (val >> 16) & 255,
                g: (val >> 8) & 255,
                b: val & 255
              };
            }

      if (!window.jspdf || !window.jspdf.jsPDF) {
        showToast("PDF engine not loaded");
        return;
      }

      if (!compareHPChart || !compareTorqueChart) {
        showToast("Comparison charts are not ready");
        return;
      }

      const hpCanvas = document.getElementById('compareHPChart');
      const torqueCanvas = document.getElementById('compareTorqueChart');
      if (!hpCanvas || !torqueCanvas) {
        showToast("Comparison canvas missing");
        return;
      }

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('l', 'mm', 'a4');
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();

      pdf.setFont('helvetica', 'bold');
      pdf.setFontSize(18);
      pdf.text('MetaSense Run Comparison Report', pageWidth / 2, 12, { align: 'center' });

      pdf.setFont('helvetica', 'normal');
      pdf.setFontSize(10);
      pdf.text('Generated: ' + new Date().toLocaleString(), 12, 20);

      const hpSeries = (compareHPChart && compareHPChart.data && compareHPChart.data.datasets) ? compareHPChart.data.datasets : [];
      const tqSeries = (compareTorqueChart && compareTorqueChart.data && compareTorqueChart.data.datasets) ? compareTorqueChart.data.datasets : [];
      const selectedSummary = compareRenderSeries.map((series) => {
        return {
          text: `Run ${series.index} | ${series.customer} | ${series.timestamp} | ${series.hpPeak.toFixed(1)} kW / ${series.torquePeak.toFixed(1)} Nm`,
          color: series.color || '#000000'
        };
      });

      // Fallback if comparison model is unexpectedly empty.
      if (selectedSummary.length === 0) {
        hpSeries.forEach((series, i) => {
          const hpPeak = (series.data || []).reduce((m, v) => {
            const n = Number(v?.y ?? v);
            return Math.max(m, Number.isFinite(n) ? n : 0);
          }, 0);
          const tqData = tqSeries[i] && tqSeries[i].data ? tqSeries[i].data : [];
          const tqPeak = tqData.reduce((m, v) => {
            const n = Number(v?.y ?? v);
            return Math.max(m, Number.isFinite(n) ? Math.abs(n) : 0);
          }, 0);
          const label = String(series.label || `Run ${i + 1}`);
          selectedSummary.push({
            text: `Run ${i + 1} | ${label} | unknown | ${hpPeak.toFixed(1)} kW / ${tqPeak.toFixed(1)} Nm`,
            color: '#000000'
          });
        });
      }

      let textY = 26;
      pdf.setFontSize(9);
      if (selectedSummary.length > 0) {
        pdf.text('Selected runs:', 12, textY);
        textY += 4;
        selectedSummary.slice(0, 6).forEach(line => {
          const rgb = colorHexToRgb(line.color);
          if (rgb) {
            pdf.setTextColor(rgb.r, rgb.g, rgb.b);
          } else {
            pdf.setTextColor(0, 0, 0);
          }
          pdf.text(line.text, 14, textY);
          textY += 4;
        });
        pdf.setTextColor(0, 0, 0);
      }

      // Force final render before capture to avoid blank/flat exports.
      compareHPChart.update('none');
      compareTorqueChart.update('none');
      const hpImg = chartImageWithWhiteBackground(hpCanvas);
      const tqImg = chartImageWithWhiteBackground(torqueCanvas);

      const chartWidth = pageWidth - 24;
      const chartHeight = Math.min(95, (pageHeight - textY - 20) / 2);
      let y = Math.max(50, textY + 2);

      pdf.setFont('helvetica', 'bold');
      pdf.setFontSize(11);
      pdf.text('Power Comparison', 12, y - 2);
      pdf.addImage(hpImg, 'PNG', 12, y, chartWidth, chartHeight);

      y += chartHeight + 10;
      pdf.text('Torque Comparison', 12, y - 2);
      pdf.addImage(tqImg, 'PNG', 12, y, chartWidth, chartHeight);

      const fileName = 'MetaSense_Run_Comparison_' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.pdf';
      pdf.save(fileName);
      showToast('Comparison PDF saved');
    }
    
    function openCompareModal() {
      if (selectedRuns.length === 0) { showToast("Select at least one run to compare!"); return; }
      document.getElementById('compareModal').style.display = 'block';
      document.getElementById('compareLoading').style.display = 'block';
      document.getElementById('compareCharts').style.display = 'none';
      document.getElementById('compareLegend').innerHTML = '';
      loadedRunData = {};
      
      // Timeout to show error if no data
      setTimeout(() => {
        if (Object.keys(loadedRunData).length === 0 && document.getElementById('compareModal').style.display === 'block') {
          document.getElementById('compareLoading').style.display = 'none';
          document.getElementById('compareCharts').style.display = 'block';
          document.getElementById('compareLegend').innerHTML = '<span style="color:red;">❌ No data received for selected runs</span>';
        }
      }, 5000);
      
      selectedRuns.forEach(idx => {
        const run = runsData[idx];
        if (run && run.filename && ws && ws.readyState === WebSocket.OPEN) {
          ws.send("GET_RUN_DATA:" + run.filename);
        }
      });
    }
    
    function closeCompareModal() {
      document.getElementById('compareModal').style.display = 'none';
      compareRenderSeries = [];
      if (compareHPChart) { 
        compareHPChart.destroy(); 
        compareTorqueChart.destroy(); 
        compareHPChart = null; 
        compareTorqueChart = null; 
      }
    }
    
    function compareSelected() {
      if (selectedRuns.length === 0) { showToast("Select at least one run to compare!"); return; }
      openCompareModal();
    }

    function saveComparisonPdfFromSelection() {
      if (selectedRuns.length === 0) {
        showToast("Select at least one run to save");
        return;
      }

      // If charts are already drawn for current selection, save immediately.
      if (compareHPChart && compareTorqueChart && Object.keys(loadedRunData).length === selectedRuns.length) {
        generateComparisonPDF();
        return;
      }

      // Otherwise open comparison and auto-save once all run data is loaded.
      pendingComparisonPdfSave = true;
      openCompareModal();
    }
    
    function showToast(msg) {
      const existing = document.getElementById("toast");
      if (existing) existing.remove();
      const toast = document.createElement("div");
      toast.id = "toast";
      toast.textContent = msg;
      toast.style.position = "fixed";
      toast.style.bottom = "100px";
      toast.style.left = "50%";
      toast.style.transform = "translateX(-50%)";
      toast.style.background = "rgba(0,150,0,0.95)";
      toast.style.color = "#fff";
      toast.style.padding = "12px 24px";
      toast.style.borderRadius = "12px";
      toast.style.zIndex = "2000";
      document.body.appendChild(toast);
      setTimeout(() => { toast.style.opacity = "0"; setTimeout(() => toast.remove(), 600); }, 2500);
    }

    // ============== WEBSOCKET CONNECTION ==============
    const connectWS = function() {
      ws = new WebSocket("ws://" + location.hostname + "/ws");
      ws.onopen = function() {
        document.getElementById("status").innerHTML = '<span class="live-badge"></span>📡 Live Trends Active';
        ws.send("SET_UI_MODE:trend");
        ws.send("GET_SETTINGS");
        ws.send("SET_TIME:" + Math.floor(Date.now() / 1000));
        loadRuns();
      };
      ws.onmessage = function(evt) {
        try {
          const msg = JSON.parse(evt.data);
          if (msg.type === "settings") {
            maxVals.rpm = msg.maxRPM || 16000;
            maxVals.hp = msg.maxHP || 15;
            maxVals.torque = msg.maxTorque || 15;
            if (lambdaChart) lambdaChart.options.scales.y.max = 1.5;
            if (massflowChart) massflowChart.options.scales.y.max = 300.0;
            if (hpChart) hpChart.options.scales.y.max = maxVals.hp;
            if (torqueChart) torqueChart.options.scales.y.max = maxVals.torque;
			
			// Update version display
const versionEl = document.getElementById("versionInfo");
if (versionEl && msg.version && msg.buildDate) {
  versionEl.innerHTML = `MetaSense V${msg.version} | ${msg.buildDate}`;
}
}
          if (msg.type === "data") {
            let lambdaValue = Number.isFinite(Number(msg.lambda)) ? Number(msg.lambda) : 0;
            let massflowValue = Number.isFinite(Number(msg.massflow_m3h)) ? Number(msg.massflow_m3h) : 0;
            const currentKW = Number.isFinite(Number(msg.kw)) ? Number(msg.kw) : 0;
            updateCharts(lambdaValue, currentKW, msg.torque || 0, massflowValue);
          }
          if (msg.type === "runs") {
            runsData = msg.data || [];
            displayRuns(runsData);
          }
          if (msg.type === "run_data") {
            if (msg.points && msg.points.length > 0) {
              loadedRunData[msg.filename] = { filename: msg.filename, points: msg.points };
              if (Object.keys(loadedRunData).length === selectedRuns.length) {
                drawComparison();
              }
            }
          }
			
          if (msg.type === "run_complete") { loadRuns(); showToast("🏁 Run complete! New run saved."); }
          if (msg.type === "info" && msg.msg.includes("deleted")) loadRuns();
        } catch(e) { console.error("WebSocket error:", e); }
      };
      ws.onclose = function() { 
        document.getElementById("status").innerHTML = '<span class="live-badge" style="background:#ff8844;"></span>⚠️ Reconnecting...';
        setTimeout(connectWS, 1000); 
      };
    };

    // ============== INITIALIZATION ==============
    lambdaChart = createChart('rpmChart', '#ff55ff', 'Lambda', 1.5);
    massflowChart = createChart('drumRpmChart', '#ffaa44', 'Massflow [m3/h]', 300.0);
    hpChart = createChart('hpChart', '#0088ff', 'Power', maxVals.hp);
    torqueChart = createChart('torqueChart', '#00ff00', 'Torque (Nm)', maxVals.torque);
    connectWS();
  </script>
</body>
</html>
