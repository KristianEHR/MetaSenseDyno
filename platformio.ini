; MetaSense-DYNO PlatformIO Configuration
;
; Compile-time facilities:
; - METASENSE_STREAM_DIAGNOSTICS (default: 1)
;   Enable stream counters (ws_clients, ws_sent_total, ws_skip_* stats)
;   To disable: add to build_flags: -D METASENSE_STREAM_DIAGNOSTICS=0
;
; - METASENSE_JSON_DELAY_COUNTERS (default: 0)
;   Enable JSON payload size measurements (ws_json_last_len, ws_json_max_len, ws_json_over_reserve_total)
;   Useful for tuning String.reserve() sizing during development
;   To enable: add to build_flags: -D METASENSE_JSON_DELAY_COUNTERS=1
;
; Example for debugging build:
;   build_flags = 
;       -D ARDUINO_USB_MODE=1
;       -D ARDUINO_USB_CDC_ON_BOOT=1
;       -D METASENSE_JSON_DELAY_COUNTERS=1
;       -I include
;

[env:esp32s3-USB]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
build_src_filter =
    +<*>
    -<egt_diag.cpp>
board_build.partitions = partitions/esp32s3_8mb_ota_littlefs.csv
board_build.filesystem = littlefs
build_type    = release
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D METASENSE_LEAF_CAN_RX_ENABLED=1
    -D METASENSE_LEAF_CAN_TX_ENABLED=1
    -D METASENSE_LEAF_CAN_LISTEN_ONLY=0
    -D METASENSE_LEAF_CAN_HANDSHAKE_ON_FIRST_1DA=1
    -D METASENSE_LEAF_CAN_TX_PIN=4
    -D METASENSE_LEAF_CAN_RX_PIN=5
    -D METASENSE_LEAF_VARIANT_120_55A=1
    -D METASENSE_LEAF_SIM_FEEDBACK_WITHOUT_BUS=0
    -D METASENSE_RBPLUS_RELAY_ENABLED=1
    -I include
lib_ldf_mode    = deep+
lib_compat_mode = strict
lib_deps =
    adafruit/Adafruit NeoPixel @ 1.15.5
    adafruit/Adafruit MCP9600 Library @ 2.0.4
    me-no-dev/ESPAsyncWebServer @ 3.6.0
    me-no-dev/AsyncTCP @ 3.3.2 
;   adafruit/Adafruit BME0 Library @ ^3.0.0
    adafruit/Adafruit BME680 Library @ ^2.0.4
    bblanchon/ArduinoJson @ ^7.0.0
lib_ignore =
upload_protocol = esptool
upload_port = COM6
monitor_speed = 115200
monitor_port = COM6
monitor_dtr = 0
monitor_rts = 0

[env:esp32s3-USB-real]
extends = env:esp32s3-USB
build_unflags =
    -D METASENSE_LEAF_SIM_FEEDBACK_WITHOUT_BUS=0
build_flags =
    ${env:esp32s3-USB.build_flags}
    -D METASENSE_LEAF_SIM_FEEDBACK_WITHOUT_BUS=0
    -D VCU_switch=1
    -D METASENSE_RBPLUS_RELAY_ENABLED=1

[env:esp32s3-USB-diag-listen]
extends = env:esp32s3-USB
build_unflags =
    -D METASENSE_LEAF_CAN_TX_ENABLED=1
build_flags =
    ${env:esp32s3-USB.build_flags}
    -D METASENSE_LEAF_CAN_LISTEN_ONLY=1
    -D METASENSE_LEAF_CAN_TX_ENABLED=0

[env:esp32s3-USB-diag-listen-rx16]
extends = env:esp32s3-USB-diag-listen
build_unflags =
    -D METASENSE_LEAF_CAN_RX_PIN=5
build_flags =
    ${env:esp32s3-USB-diag-listen.build_flags}
    -D METASENSE_LEAF_CAN_RX_PIN=16

[env:esp32s3-USB-diag-listen-rx16-250k]
extends = env:esp32s3-USB-diag-listen-rx16
build_flags =
    ${env:esp32s3-USB-diag-listen-rx16.build_flags}
    -D METASENSE_LEAF_CAN_BITRATE_KBPS=250

[env:esp32s3-USB-diag-listen-rx16-125k]
extends = env:esp32s3-USB-diag-listen-rx16
build_flags =
    ${env:esp32s3-USB-diag-listen-rx16.build_flags}
    -D METASENSE_LEAF_CAN_BITRATE_KBPS=125

