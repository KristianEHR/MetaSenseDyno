; MetaSense-DYNO PlatformIO Configuration
;
; Active Compile-time Configuration:
;
; - METASENSE_CAN_MONITOR_MODE (default: 0)
;   Enable detailed CAN frame monitoring and metrics collection
;   When 0 (production): Fast 16ms telemetry, core data ONLY (rpm, power, temps)
;                       NO leaf_1da/1d4/11a CAN metrics in JSON (CPU/WiFi efficient)
;   When 1 (debug):     Detailed CAN monitor frame data (0x1DA/0x1D4/0x11A), 50ms telemetry
;                       Includes all leaf_* metrics for frame-by-frame analysis
;   esp32s3-ota: 0 (production - minimal metrics)
;   esp32s3-USB: 0 (production - minimal metrics)
;
; - CAN/Hardware Configuration
;   Pin assignments, torque calibration, frame templates, relay/heartbeat settings
;

[env:esp32s3-ota]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
build_src_filter =
    +<*>
    -<egt_diag.cpp>
board_build.partitions = partitions/esp32s3_8mb_ota_littlefs.csv
board_build.filesystem = littlefs
build_type    = release
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D METASENSE_CAN_MONITOR_MODE=0
    -I include
lib_ldf_mode    = deep+
lib_compat_mode = strict
lib_deps =
    adafruit/Adafruit NeoPixel @ 1.15.5
    adafruit/Adafruit MCP9600 Library @ 2.0.4
    me-no-dev/ESPAsyncWebServer @ 3.6.0
    me-no-dev/AsyncTCP @ 3.3.2 
;   adafruit/Adafruit BME0 Library @ ^3.0.0
    adafruit/Adafruit BME680 Library @ ^2.0.4
    bblanchon/ArduinoJson @ ^7.0.0
lib_ignore =
upload_protocol = espota
upload_port = 192.168.0.211
upload_flags =
    --auth=metasense
; Network-based serial monitoring via telnet on OTA device at 192.168.0.211
monitor_speed = 115200
monitor_port = socket://192.168.0.211:23
monitor_dtr = 0
monitor_rts = 0

[env:esp32s3-USB]

platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
build_src_filter =
    +<*>
    -<egt_diag.cpp>
board_build.partitions = partitions/esp32s3_8mb_ota_littlefs.csv
board_build.filesystem = littlefs
build_type    = release
build_flags =
    -D ARDUINO_USB_MODE=0
    -D METASENSE_CAN_MONITOR_MODE=0
    -I include
lib_ldf_mode    = deep+
lib_compat_mode = strict
lib_deps =
    adafruit/Adafruit NeoPixel @ 1.15.5
    adafruit/Adafruit MCP9600 Library @ 2.0.4
    me-no-dev/ESPAsyncWebServer @ 3.6.0
    me-no-dev/AsyncTCP @ 3.3.2 
;   adafruit/Adafruit BME0 Library @ ^3.0.0
    adafruit/Adafruit BME680 Library @ ^2.0.4
    bblanchon/ArduinoJson @ ^7.0.0
lib_ignore =
upload_protocol = esptool
upload_port = COM6
upload_flags =
monitor_speed = 115200
monitor_port = COM6
monitor_dtr = 0
monitor_rts = 0

